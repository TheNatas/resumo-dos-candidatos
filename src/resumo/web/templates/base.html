<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resumo dos Candidatos{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header>
    <a href="/" class="brand">Resumo dos Candidatos</a>
    <span class="tag">Transparência Eleitoral 2026 · dados oficiais</span>

  <footer>
    <p>Dados públicos (TSE · Câmara dos Deputados). Histórico exibido apenas para
    incumbentes confirmados; metodologia e fontes documentadas.</p>
  </footer>
</body>
</html>
