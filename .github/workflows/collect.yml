# Coleta das fontes públicas → snapshot. Runner público (minutos ilimitados em
# repositório público) e NENHUM segredo: nenhuma fonte exige chave de API.
#
# É o caminho LENTO do projeto (~3 h, quase tudo em rede) e por isso vive separado
# de `deploy.yml`: dado novo chega uma vez por dia, código muda muitas vezes por dia,
# e prender a publicação de um push atrás da coleta custava horas por mudança.
#
# O banco não mora no repositório. Ele vive aqui como service container efêmero,
# restaurado a cada execução a partir do snapshot publicado na release `snapshot`.
# Se o snapshot sumir, o backfill completo roda de novo: os coletores são
# idempotentes e todas as fontes são públicas, então o pipeline se recupera sozinho.
#
# Este workflow é o ÚNICO que escreve o snapshot. O `deploy.yml` só lê. Um escritor
# só, nenhuma corrida: dois workflows gravando sob chaves diferentes podiam fazer
# uma publicação regravar por cima de dado mais fresco que a coleta acabara de subir.
name: collect

on:
  schedule:
    - cron: "0 8 * * *" # 05:00 BRT — o TSE regenera os arquivos por volta das 04:00
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Ignora o snapshot e recoleta tudo do zero"
        type: boolean
        default: false

permissions:
  contents: write # publica o snapshot como asset da release
  issues: write # abre/atualiza o aviso quando um coletor falha

# Uma coleta por vez, sem cancelar a que já está rodando — são ~3 h de rede que não
# se recuperam. Grupo próprio, separado do `pages`: a publicação não espera por isto.
concurrency:
  group: coleta
  cancel-in-progress: false

env:
  RESUMO_DATABASE_URL: postgresql+psycopg://resumo:resumo@localhost:5432/resumo
  RESUMO_STORAGE_DIR: ./data/storage
  SNAPSHOT_DIR: .snapshot
  SNAPSHOT_TAG: snapshot

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # o teto do job é 6 h; o backfill frio cabe com folga
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: resumo
          POSTGRES_PASSWORD: resumo
          POSTGRES_DB: resumo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resumo -d resumo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Sem chave de API em nenhuma fonte: este header é a ÚNICA identificação do
      # operador. Defina a variável RESUMO_CONTACT no repositório
      # (Settings → Secrets and variables → Actions → Variables).
      RESUMO_HTTP_USER_AGENT: >-
        resumo-dos-candidatos/0.1 (transparencia eleitoral;
        ${{ vars.RESUMO_CONTACT || 'contato-nao-configurado@exemplo.invalid' }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync

      # O snapshot carrega o banco E os arquivos binários (PDFs das propostas, JPEGs
      # das fotos). Os dois juntos, de propósito: o ledger RawIngestion trata
      # artefato inalterado como no-op, então um banco restaurado sem os arquivos no
      # disco nunca os rebaixaria — propostas e fotos sumiriam do site.
      #
      # Ausência de snapshot não é erro aqui (é a primeira execução, ou um
      # full_backfill pedido na mão): os coletores reconstroem tudo do zero.
      - name: Baixa o snapshot
        id: snapshot
        if: ${{ !inputs.full_backfill }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SNAPSHOT_DIR"
          if gh release download "$SNAPSHOT_TAG" --dir "$SNAPSHOT_DIR" --clobber; then
            echo "encontrado=sim" >> "$GITHUB_OUTPUT"
            du -sh "$SNAPSHOT_DIR"/*
          else
            echo "encontrado=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem snapshot anterior — esta execução faz o backfill completo."
          fi

      # TRANSITÓRIO — pode ser apagado depois da primeira coleta bem-sucedida.
      # O snapshot morava no cache do Actions até a migração para a release. Sem
      # esta ponte, a primeira execução não acharia release nenhuma e refaria o
      # backfill completo (3-6 h) tendo o dado de ontem ali do lado.
      - name: Snapshot antigo no cache do Actions (ponte de migração)
        id: cache_legado
        if: ${{ !inputs.full_backfill && steps.snapshot.outputs.encontrado == 'nao' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SNAPSHOT_DIR }}
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-

      - name: Carrega o snapshot no Postgres
        if: ${{ steps.snapshot.outputs.encontrado == 'sim' || steps.cache_legado.outputs.cache-matched-key != '' }}
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$PWD/$SNAPSHOT_DIR:/s" postgres:16 \
            pg_restore --no-owner --clean --if-exists \
              -d "postgresql://resumo:resumo@localhost:5432/resumo" /s/resumo.dump
          tar -xzf "$SNAPSHOT_DIR/storage.tar.gz" -C .
          echo "arquivos restaurados: $(du -sh "$RESUMO_STORAGE_DIR" 2>/dev/null | cut -f1 || echo 0)"

      - name: Migrações
        run: uv run resumo db-upgrade
      - run: uv run resumo scope

      # Cada coletor é isolado do `bash -e` por um `if !`. Sem isso, o primeiro que
      # falha aborta todos os seguintes no mesmo passo — foi o que aconteceu na
      # primeira execução (um 400 da Câmara levou junto nove coletores) e o
      # `continue-on-error` do passo relatou sucesso. Falha de fonte vira anotação
      # visível, não silêncio: o snapshot já guarda o que foi coletado antes, então
      # uma fonte fora do ar significa "sem dado novo hoje", não site fora do ar.
      - name: Coleta
        id: coleta
        run: |
          HOJE="$(date -u +%F)"
          ANOS="2023,2024,2025,2026"
          falhas=()
          coletar() {
            echo "::group::$*"
            if ! "$@"; then
              falhas+=("$*")
              echo "::warning::coletor falhou: $*"
            fi
            echo "::endgroup::"
          }

          coletar uv run resumo collect tse-candidates
          coletar uv run resumo collect tse-assets
          coletar uv run resumo collect tse-proposta
          coletar uv run resumo collect tse-fotos
          coletar uv run resumo collect tse-contas

          # Backfill das eleições passadas. A ponte de CPF (cpf_via_tse) recupera a
          # identidade de quem exerce mandato a partir do arquivo do TSE da eleição
          # em que a pessoa se elegeu — e sem esses anos em base ela não tem a que
          # ligar: a CI nasceu só com 2026, e por isso a ponte ficava inerte aqui
          # enquanto funcionava na máquina local. Idempotente: o ledger transforma
          # as execuções seguintes em no-op.
          for ano in 2018 2022; do
            coletar env RESUMO_ELECTION_YEAR=$ano uv run resumo collect tse-candidates
          done

          # Mandatos sempre antes do histórico: os demais coletores só guardam linhas
          # de quem já tem mandato em base.
          coletar uv run resumo collect camara-deputados
          coletar uv run resumo collect senado-senadores
          coletar uv run resumo collect alesc-deputados

          # Votação antiga não muda, mas o coletor refazia o ano inteiro toda
          # execução: ~6.900 votações da Câmara mais duas chamadas cada, ~3 h de
          # rede por dia para reaprender fato imutável. A janela agora parte do que
          # já está em base, POR CASA — a ALESC publica em ritmo diferente da
          # Câmara, e um máximo global faria a Casa mais lenta ser pulada pelo
          # avanço da mais rápida. Sobreposição para não perder votação publicada
          # com atraso; banco vazio continua pedindo o ano inteiro.
          # Se a consulta falhar, a janela volta a ser o ano inteiro: coletar demais
          # é desperdício, coletar de menos é buraco silencioso no histórico.
          janela() {
            d="$(uv run resumo janela --house "$1" 2>/dev/null)"
            case "$d" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) echo "$d" ;;
              *) echo "${RESUMO_ELECTION_YEAR:-2026}-01-01" ;;
            esac
          }
          DE_CAMARA="$(janela CAMARA)"
          DE_SENADO="$(janela SENADO)"
          DE_ALESC="$(janela ASSEMBLEIA)"
          echo "janelas — câmara: $DE_CAMARA · senado: $DE_SENADO · alesc: $DE_ALESC"

          coletar uv run resumo collect camara-despesas    --anos "$ANOS"
          coletar uv run resumo collect camara-proposicoes
          coletar uv run resumo collect camara-votacoes    --inicio "$DE_CAMARA" --fim "$HOJE"
          coletar uv run resumo collect camara-eventos     --inicio "$DE_CAMARA" --fim "$HOJE"
          coletar uv run resumo collect senado-despesas    --anos "$ANOS"
          coletar uv run resumo collect senado-proposicoes
          coletar uv run resumo collect senado-votacoes    --inicio "$DE_SENADO" --fim "$HOJE"
          coletar uv run resumo collect alesc-despesas     --anos 2025,2026
          coletar uv run resumo collect alesc-votacoes     --inicio "$DE_ALESC" --fim "$HOJE"
          coletar uv run resumo collect alesc-presenca     --inicio "$DE_ALESC" --fim "$HOJE"
          coletar uv run resumo collect alesc-proposicoes  --anos 2026

          coletar uv run resumo collect emendas
          coletar uv run resumo link-emendas-authors

          if [ ${#falhas[@]} -gt 0 ]; then
            echo "::warning::${#falhas[@]} coletor(es) falharam nesta execução"
            { echo "### Coletores com falha (${#falhas[@]})"; printf '\n- `%s`' "${falhas[@]}"; } \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Todos os coletores rodaram sem erro" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Publica a lista para o passo de aviso. Sem isso a degradação fica só no
          # log: o Actions só avisa quando o workflow FALHA, e este de propósito não
          # falha por fonte fora do ar — foi assim que nove coletores ficaram
          # silenciosamente parados por duas execuções.
          {
            echo "falhas<<FIM"
            printf '%s\n' "${falhas[@]}"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      # Um aviso que ninguém vê não é aviso. Mantém UMA issue aberta: comenta
      # enquanto houver falha, fecha sozinha quando tudo volta a rodar.
      - name: Avisa (ou encerra o aviso) sobre coletores
        if: always() && steps.coleta.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FALHAS: ${{ steps.coleta.outputs.falhas }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Coletores falhando"
          num=$(gh issue list --state open --limit 50 --json number,title \
                --jq ".[] | select(.title == \"$TITULO\") | .number" | head -1)

          if [ -n "$(echo "$FALHAS" | tr -d '[:space:]')" ]; then
            corpo=$(printf 'Coletores que falharam na última execução:\n\n%s\n\nExecução: %s' \
                    "$(echo "$FALHAS" | sed 's/^/- `/; s/$/`/')" "$RUN_URL")
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "$corpo"
            else
              gh issue create --title "$TITULO" --body "$corpo"
            fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "Todos os coletores voltaram a rodar sem erro em $RUN_URL — fechando."
            gh issue close "$num"
          fi

      # O snapshot é o único elo entre a coleta e a publicação, então ele mora numa
      # release, não no cache do Actions: o cache é LRU com teto de 10 GB por
      # repositório e expira sozinho após 7 dias sem uso, e perder o snapshot passou
      # a custar uma republicação falha, não só uma execução mais lenta. Asset de
      # release não expira e aguenta 2 GB por arquivo — folga larga sobre os ~9 MB
      # de hoje, e espaço para os JPEGs das fotos crescerem.
      - name: Publica o snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SNAPSHOT_DIR" "$RESUMO_STORAGE_DIR"
          docker run --rm --network host -v "$PWD/$SNAPSHOT_DIR:/s" postgres:16 \
            pg_dump -Fc -Z6 -d "postgresql://resumo:resumo@localhost:5432/resumo" -f /s/resumo.dump
          tar -czf "$SNAPSHOT_DIR/storage.tar.gz" "$RESUMO_STORAGE_DIR"
          du -sh "$SNAPSHOT_DIR"/*

          # A release é um ponteiro fixo, sempre sobrescrito: não versionamos
          # snapshots, o mais recente é o único que interessa.
          gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1 || \
            gh release create "$SNAPSHOT_TAG" --target "$GITHUB_SHA" \
              --title "Snapshot dos dados coletados" --prerelease \
              --notes "Banco (pg_dump -Fc) e arquivos binários da última coleta. Sobrescrito a cada execução do workflow \`collect\`. Não é um release de software."
          gh release upload "$SNAPSHOT_TAG" \
            "$SNAPSHOT_DIR/resumo.dump" "$SNAPSHOT_DIR/storage.tar.gz" --clobber

  # Dado novo só vale quando está no ar. Reaproveita o `deploy.yml` inteiro em vez
  # de duplicar render e publicação — uma cópia só do caminho que gera o site.
  publica:
    needs: coleta
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
