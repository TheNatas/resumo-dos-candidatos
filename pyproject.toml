[project]
name = "resumo-dos-candidatos"
version = "0.1.0"
description = "Plataforma de Transparência Eleitoral 2026 — coletores idempotentes + banco normalizado + front público mínimo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pypdf>=4.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
]

[project.optional-dependencies]
# Production-grade probabilistic record linkage. The pipeline runs WITHOUT this
# (a rapidfuzz-based scorer is the built-in fallback); install for Splink-backed
# Fellegi–Sunter linkage at national scale: `uv sync --extra resolution`.
resolution = ["splink>=4.0"]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
resumo = "resumo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumo"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines tolerated. UP042: we rely on str-Enum mix. UP045: Optional[...] kept
# for Typer clarity. B008: Depends()/typer.Option() in defaults is the framework idiom.
ignore = ["E501", "UP042", "UP045", "B008"]
